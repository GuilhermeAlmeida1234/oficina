<body class="contato">

    <header class="cabecalho">
        <img src="../Imagens/gray.png" alt="Logo da Oficina" class="Logo">
        <nav class="nav-list">
            <ul>
                <li class="nav" id="home"><a href="index.html">Início</a></li>

            </ul>

    <main>
        <section class="conteudo">
            <h1>Contato</h1>

            <form class="formCadastro" id="formEmail" novalidate style="display: inline;">

                <section>
                    <label>Nome:</label>                  
                </section>
                    
                <section>
                    <input class="inputNome" type="text" id="nome" name="nome">
                </section>
                
                <section>
                        <label class="inputEmail">Email:</label>                        
                </section>
                    
                <section>
                    <input type="text" id="email" name="email">
                </section>
            
                <section>
                    <label class="tipoContato">Tipo de Contato:</label>
                </section>
                
                <section class="opcoes">
                    <select id="contato" name="contato">   
                    <option value="selecione">Selecione</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="reclamacao">Reclamação</option>
                    <option value="duvida">Dúvida</option>
                    <option value="elogio">Elogio</option>
                    <option value="outros">Outros</option>
                </select>
                </section>
                

                
                
            <section>
                <label class="mensagemArea">Mensagem:</label>
                <textarea class="areaTexto" id="texto" name="texto" rows="5"></textarea>
            </section>
                

                <button type="submit" class="Botão" id="btnSubmit">
                    Enviar
                </button>

            </form>
        </section>
    </main>
    <footer class="pe">
        <div class="redes">
            <a href="https://wa.me/" target="_blank" class="whatsapp icone">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="https://instagram.com/" target="_blank" class="instagram icone">

                <i class="fa-brands fa-tiktok"></i>
            </a>
            <a href="https://twitter.com/" target="_blank" class="twitter icone">
                <i class="fa-brands fa-x"></i>
            </a>
            <a href="https://www.youtube.com/" target="_blank" class="youtube icone">
                <i class="fa-brands fa-youtube"></i>
            </a>
        </div>
    </footer>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="fechar">&times;</span>
            <h2>Login</h2>
            <form id="formLogin">
                <input type="text" id="EmailLogin" placeholder="Email">
                <input type="password" id="SenhaLogin" placeholder="Senha">
                <button type="submit" class="btnSubmit">Entrar</button>
            </form>
        </div>
    </div>

    <div class="modal" id="cadastroModal">
        <div class="modal-content">
            <span class="fechar">&times;</span>
            <h2>Cadastro</h2>
            <form id="formCadastro">
                <input type="text" id="EmailCadastro" placeholder="Email">
                <input type="password" id="SenhaCadastro" placeholder="Senha">
                <button type="submit" class="btnSubmit">Cadastrar</button>
            </form>
        </div>
    </div>

    <div class="modal" id="perfilModal">
        <div class="modal-content">
            <span class="fechar" id="fecharPerfil">&times;</span>

            <h2>Meu Perfil</h2>

            <p>Nome: <span id="nomeUsuario"></span></p>
            <p>Email: <span id="emailUsuario"></span></p>

            <button class="btnSubmit" id="btnSair">Sair</button>
        </div>
    </div>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <script>
        (function () {
            emailjs.init("OEquGiC5Rsa2tjwBw");
        })();
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const form = document.getElementById("formEmail");

            const nomeInput = document.getElementById("nome");
            const emailInput = document.getElementById("email");
            const contatoSelect = document.getElementById("contato");
            const mensagemInput = document.getElementById("texto");

            function validarEmail(email) {
                const padrao = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return padrao.test(email);
            }

            function validarCampos() {

                if (nomeInput.value.trim() === "" ||
                    emailInput.value.trim() === "" ||
                    mensagemInput.value.trim() === "") {

                    swal("Erro", "Preencha todos os campos", "error");
                    return false;
                }

                if (contatoSelect.value === "selecione") {

                    swal("Erro", "Selecione o tipo de contato", "error");
                    return false;
                }

                if (!validarEmail(emailInput.value)) {

                    swal("Erro", "Email inválido", "error");
                    return false;
                }

                return true;
            }

            form.addEventListener("submit", (e) => {
                e.preventDefault();

                if (!validarCampos()) return;

                emailjs.sendForm(
                    "service_va8j8f5",
                    "template_9pep37f",
                    form
                ).then(() => {

                    swal("Sucesso!", "Mensagem enviada!", "success");
                    form.reset();

                }).catch((err) => {

                    swal("Erro", "Falha ao enviar: " + err.text, "error");

                });

            });

        });
    </script>

</body>

</html>
