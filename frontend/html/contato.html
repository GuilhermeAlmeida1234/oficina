<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="icon" href="../Imagens/black.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styleBase.css">
</head>
<body class="contato">
    <header class="cabecalho">
            <img src="../Imagens/gray.png" alt="Logo da Oficina" class="Logo">
        <nav class="nav-list">
            <ul>
                <li class="nav" id="home"><a href="base.html">Início</a></li>
                <li class="nav" id="servicos"><a href="servicos.html">Serviços</a></li>
                <li class="nav" id="sobre"><a href="sobre.html">Sobre Nós</a></li>
                <li class="nav" id="contato"><a href="#">Contato</a></li>
            </ul>
            <button class="usuario">
                <i class="fa-solid fa-user" id="userIcon"></i>
            </button>
        </nav>
            <button class="menu-toggle">☰</button>
            <nav class="menu">
                <ul>
                    <li><a href="base.html">Início</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="sobre.html">Sobre Nós</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
    </header>
    <main>
        <section class="conteudo">
            <h1>Contato</h1>
            <form id="formEmail" novalidate>
                <label for="nome">Nome:</label><br>
                <input type="text" name="nome" id="nome" required><br><br>

                <label for="email">Email:</label><br>
                <input type="text" name="email" id="email" required><br><br>

                <label for="contato" class="inline">Tipo de Contato</label><br>
                <select name="contato" id="contato" required>
                    <option value="selecione">Selecione</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="reclamacao">Reclamação</option>
                    <option value="duvida">Dúvida</option>
                    <option value="elogio">Elogio</option>
                    <option value="outros">Outros</option>
                </select><br><br>

                <label for="texto">Mensagem:</label><br>
                <textarea rows="5" id="texto" name="texto" required></textarea><br><br>

                <button type="submit" class="Botão" id="btnSubmit">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="pe">
            <div class="redes">
                <a href="https://wa.me/" target="_blank" class="whatsapp icone">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a href="https://instagram.com/" target="_blank" class="instagram icone">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/" target="_blank" class="tiktok icone">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://twitter.com/" target="_blank" class="twitter icone">
                    <i class="fa-brands fa-x"></i>
                </a>
                <a href="https://www.youtube.com/" target="_blank" class="youtube icone">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
    </footer>
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="fechar">&times;</span>
            <h2>Login</h2>
            <form id="formLogin" novalidate>
                <input type="text" name="Email" placeholder="Email" id="EmailLogin" required autocomplete="email">
                <input type="password" name="Senha" placeholder="Senha" class="inputSenha" id="SenhaLogin" required>
                <button type="submit" class="btnSubmit" id="btnSubmitLogin">Entrar</button>
            </form>
            <p>
                Não tem uma conta?
            </p>
            <a href="#" id="abrirCadastro">Cadastre-se</a>
        </div>
    </div>
    <div class="modal" id="cadastroModal">
        <div class="modal-content">
            <span class="fechar">&times;</span>
            <h2>Cadastro</h2>
            <form id="formCadastro" novalidate>
                <input type="text" name="email" placeholder="Email" required class="inputEmail" id="EmailCadastro" autocomplete="email">
                <input type="password" name="senha" placeholder="Senha" required id="SenhaCadastro">
                <input type="password" name="confirmarSenha" required placeholder="Confirmar Senha" class="inputSenha" id="ConfirmarSenhaCadastro">
                <button type="submit" class="btnSubmit" id="btnSubmitCadastro">Cadastrar</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js" defer></script>
    <script src="../script/carrossel.js" defer></script>
    <script src="../script/validacao.js" defer></script>
    <script src="../script/script.js" defer></script>

    <script defer>
        const nomeInput = document.getElementById('nome');
        const emailInput = document.getElementById('email');
        const contatoSelect = document.getElementById('contato');
        const txtMensagem = document.getElementById('texto');
        const btnSubmit = document.getElementById('btnSubmit');
        const form = document.getElementById('formEmail');

        function validarEmail2(email){
            const padrao = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return padrao.test(email);
        }
        function validarCampos2(){
            const nome = nomeInput.value.trim();
            const email = emailInput.value.trim();
            const contato = contatoSelect.value;
            const mensagem = txtMensagem.value.trim();

            if(nome === "" || email === "" || mensagem === "" || contato === ""){
                console.log("Erro")
                swal({
                    title: "Erro!",
                    text: "Por favor, preencha todos os campos.",
                    icon: "error",
                    button: "OK",
                    closeOnClickOutside: false,
                    closeOnEsc: false,
                })
                return false;
            }
            if(contato === "selecione"){
                console.log("erro2")
                swal({
                    title: "Erro!",
                    text: "Por favor, escolha o motivo do contato.",
                    icon: "error",
                    button: "OK",
                    closeOnClickOutside: false,
                    closeOnEsc: false,
                })
                return false;
            }
            if(!validarEmail2(email)){
                console.log("erro3")
                swal({
                    title: "Erro!",
                    text: "Por favor, digite um email válido.",
                    icon: "error",
                    button: "OK",
                    closeOnClickOutside: false,
                    closeOnEsc: false,
                })
                return false;
            }
            return true;
        }
            document.getElementById("formEmail").addEventListener("submit", function(event){
            event.preventDefault();

            if (!validarCampos2()) return;
            
            console.log("erro4")
            swal({
                title: "Sucesso!",
                text: "Sua mensagem foi enviada com sucesso.",
                icon: "success",
                button: "OK",
                closeOnClickOutside: false,
                closeOnEsc: false,
            })
            form.reset();
        });
    </script>

    
</body>
</html>
