<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="icon" href="../Imagens/black.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styleBase.css">
</head>
<body class="contato">
    <header class="cabecalho">
            <img src="../Imagens/gray.png" alt="Logo da Oficina" class="Logo">
        <nav class="nav-list">
            <ul>
                <li class="nav" id="home"><a href="base.html">Início</a></li>
                <li class="nav" id="servicos"><a href="servicos.html">Serviços</a></li>
                <li class="nav" id="sobre"><a href="sobre.html">Sobre Nós</a></li>
                <li class="nav" id="contato"><a href="contato.html">Contato</a></li>
            </ul>
            <div class="usuario">
                <i class="fa-solid fa-user" id="userIcon"></i>
            </div>
        </nav>
    </header>
    <main>
        <section class="conteudo">
            <h1>Contato</h1>
            <form id="formEmail">
                <label for="nome">Nome:</label><br>
                <input type="text" name="nome" id="nome"><br><br>

                <label for="email">Email:</label><br>
                <input type="email" name="email" id="email"><br><br>

                <label for="contato" class="inline">Tipo de Contato</label><br>
                <select name="contato" id="contato">
                    <option value="">Selecione</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="reclamacao">Reclamação</option>
                    <option value="duvida">Dúvida</option>
                    <option value="elogio">Elogio</option>
                    <option value="outros">Outros</option>
                </select><br><br>

                <label for="texto">Mensagem:</label><br>
                <textarea rows="5" id="texto" name="texto"></textarea><br><br>

                <button type="submit" class="Botão" id="btnSubmit">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="pe">
            <div class="redes">
                <a href="https://wa.me/" target="_blank" class="whatsapp icone">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a href="https://instagram.com/" target="_blank" class="instagram icone">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/" target="_blank" class="tiktok icone">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://twitter.com/" target="_blank" class="twitter icone">
                    <i class="fa-brands fa-x"></i>
                </a>
                <a href="https://www.youtube.com/" target="_blank" class="youtube icone">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
        </footer>
    </footer>
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="fechar">&times;</span>
            <h2>Login</h2>
            <form id="formLogin">
                <input type="email" name="Email" placeholder="Email" required>
                <input type="password" name="Senha" placeholder="Senha" required class="inputSenha">
                <button type="submit" class="btnSubmit">Entrar</button>
            </form>
            <p>
                Não tem uma conta?
            </p>
            <a href="#" id="abrirCadastro">Cadastre-se</a>
        </div>
    </div>
    <div class="modal" id="cadastroModal">
        <div class="modal-content">
            <span class="fechar">&times;</span>
            <h2>Cadastro</h2>
            <form id="formCadastro">
                <input type="email" name="email" placeholder="Email" required class="inputEmail">
                <input type="password" name="senha" placeholder="Senha" required>
                <input type="password" name="confirmarSenha" placeholder="Confirmar Senha" required class="inputSenha">
                <button type="submit" class="btnSubmit">Cadastrar</button>
            </form>
        </div>
    </div>
    <script>
        const nomeInput = document.getElementById('nome');
        const emailInput = document.getElementById('email');
        const contatoSelect = document.getElementById('contato');
        const txtMensagem = document.getElementById('texto');
        const btnSubmit = document.getElementById('btnSubmit');
        const form = document.getElementById('formEmail');

        function validarEmail(email){
            const padrao = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return padrao.test(email);
        }
        function validarCampos(){
            const nome = nomeInput.value.trim();
            const email = emailInput.value.trim();
            const contato = contatoSelect.value;
            const mensagem = txtMensagem.value.trim();

            if(nome === '' || email === '' || mensagem === ''){
                swal({
                    title: "Erro!",
                    text: "Por favor, preencha todos os campos.",
                    icon: "error",
                    button: "OK",
                    closeOnClickOutside: false,
                    closeOnEsc: false,
                })
                return false;
            }
            if(contato === ''){
                swal({
                    title: "Erro!",
                    text: "Por favor, preencha todos os campos.",
                    icon: "error",
                    button: "OK",
                    closeOnClickOutside: false,
                    closeOnEsc: false,
                })
                return false;
            }
            if(contato === "Sugestão"){
                swal({
                    title: "Erro!",
                    text: "Por favor, escolha o motivo do contato.",
                    icon: "error",
                    button: "OK",
                    closeOnClickOutside: false,
                    closeOnEsc: false,
                })
                return false;
            }
            if(!validarEmail(email)){
                swal({
                    title: "Erro!",
                    text: "Por favor, digite um email válido.",
                    icon: "error",
                    button: "OK",
                    closeOnClickOutside: false,
                    closeOnEsc: false,
                })
                return false;
            }
            return true;
        }
            document.getElementById("formEmail").addEventListener("submit", function(event){
            event.preventDefault();

            if(!validarCampos() || !validarEmail(emailInput.value)){
                return;
            }
            form.reset();
        });
    </script>

    <script src="../script/carrossel.js"></script>
    <script src="../script/validacao.js"></script>
    <script src="../script/script.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

</body>
</html>
