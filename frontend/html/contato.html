<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="icone" href="../Imagens/black.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styleBase.css">
</head>
<body class="contato">
    <header class="cabecalho">
        <img src="../Imagens/gray.png" class="Logo">
        <nav class="nav-list">
            <ul>
                <li><a href="base.html">Início</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
            <div class="usuario">
                <i class="fa-solid fa-user" id="userIcon" onclick="abrirLogin()"></i>
            </div>
        </nav>
    </header>
    <main>
        <section class="conteudo">
            <h1>Contato</h1>
            <form>
                <label>Nome:</label><br>
                <input type="text"><br><br>

                <label>Email:</label><br>
                <input type="email"><br><br>

                <label>Mensagem:</label><br>
                <textarea rows="5"></textarea><br><br>

                <button type="submit" class="Botão">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="pe">
            <div class="redes">
                <a href="https://wa.me/" target="_blank" class="whatsapp icone">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a href="https://instagram.com/" target="_blank" class="instagram icone">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/" target="_blank" class="tiktok icone">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://twitter.com/" target="_blank" class="twitter icone">
                    <i class="fa-brands fa-twitter"></i>
                </a>
                <a href="https://www.youtube.com/" target="_blank" class="youtube icone">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
        </footer>
    </footer>
</body>
</html>
